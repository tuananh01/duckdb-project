version: 2 

models: 
    - name: fct_orders 
      description: One record orders
      columns:
        - name: order_id 
          description: Primary key for orders
          tests:
            - not_null
            - unique
        - name: customer_id 
          tests:
            - relationships:
                arguments:
                    to: ref('stg_jaffle_shop__customers')
                    field: customer_id
        
        - name: order_date 
          description: Date of the order
          tests:
            - not_null
        - name: amount 
          description: The amount customer spent on a success payment
          tests:
            - not_null