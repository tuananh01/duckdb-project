version: 2

sources: 
    - name: jaffle_shop 
      description: This is the source data for the jaffle shop project
      database: raw
      schema: jaffle_shop
      tables:
      - name: customers
        description: Raw customers data
        columns: 
        - name: id
          description: Primary key for customers
          tests:
          - not_null
          - unique
           
      - name: orders
        description: Raw orders data
        config:
          loaded_at_field: _etl_loaded_at
          freshness:
            warn_after: {count: 15, period: day}
            error_after: {count: 30, period: day}
        columns:  
        - name: id   
          description: Primary key for orders
          tests:
          - not_null
          - unique
       